[project]
name = "datenum"
version = "0.1.0"
description = "MATLAB-style numeric dates for Python"
readme = "README.md"
authors = [
    { name = "lkkbox", email = "mail@mail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
py-datenum = "py_datenum:main"

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = ["pytest>=7.0", "numpy>=1.24"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
ignore = ["DTZ001"]
